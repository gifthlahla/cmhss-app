<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Zim Currency Converter — SADC Region Exchange Rates</title>
	
	<!-- SEO Meta Tags -->
	<meta name="description" content="Minimalist, fast, and accurate currency converter for Zimbabwe and the SADC region. Real-time rates for ZWL, ZAR, USD, and more.">
	<meta name="keywords" content="Zimbabwe, currency converter, ZWL, ZAR, SADC, exchange rates, minimalist">
	<link rel="canonical" href="https://zim-currency-converter.pages.dev/">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://zim-currency-converter.pages.dev/">
	<meta property="og:title" content="Zim Currency Converter — SADC Region Exchange Rates">
	<meta property="og:description" content="Real-time exchange rates for Zimbabwe and the SADC region in a clean, minimalist interface.">
	<meta property="og:image" content="https://zim-currency-converter.pages.dev/assets/og-image.png">

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" content="https://zim-currency-converter.pages.dev/">
	<meta property="twitter:title" content="Zim Currency Converter — SADC Region Exchange Rates">
	<meta property="twitter:description" content="Real-time exchange rates for Zimbabwe and the SADC region in a clean, minimalist interface.">
	<meta property="twitter:image" content="https://zim-currency-converter.pages.dev/assets/og-image.png">
	<meta name="theme-color" id="theme-meta" content="#0D6EFD">

	<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">
	<script>
		(function() {
			const savedTheme = localStorage.getItem('theme');
			const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			const theme = savedTheme || (preferredDark ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<script src="script.js" defer></script>
</head>
<body>
	<div class="app-container">
		<header>
			<h1><span aria-hidden="true">💱</span> Zim Currency Converter</h1>
			<button id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
		</header>

		<main>
			<form id="converter-form" aria-label="Currency converter" novalidate>
				<label for="amount">Amount</label>
				<input id="amount" name="amount" type="number" inputmode="decimal" min="0" step="any" required />

				<div class="currency-row">
					<div class="group from">
						<label for="from">From</label>
						<select id="from" name="from" aria-label="From currency"></select>
					</div>

					<button id="swap" type="button" aria-label="Swap currencies">⇄</button>

					<div class="group to">
						<label for="to">To</label>
						<select id="to" name="to" aria-label="To currency"></select>
					</div>
				</div>

				<button type="submit">Convert</button>
			</form>

			<section class="result-panel" aria-live="polite" hidden>
				<p class="conversion-text"></p>
				<p class="rate-text"></p>
				<p class="timestamp"></p>
			</section>
		</main>

		<footer>
			<p>Rates by ExchangeRate-API</p>
		</footer>
	</div>
</body>
</html>
