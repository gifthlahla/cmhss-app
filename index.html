<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Zim Currency Converter — SADC Region Exchange Rates</title>
	
	<!-- SEO Meta Tags -->
	<meta name="description" content="Minimalist, fast, and accurate currency converter for Zimbabwe and the SADC region. Real-time rates for ZWL, ZAR, USD, and more.">
	<meta name="keywords" content="Zimbabwe, currency converter, ZWL, ZAR, SADC, exchange rates, minimalist">
	<link rel="canonical" href="https://zim-currency-converter.pages.dev/">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://zim-currency-converter.pages.dev/">
	<meta property="og:title" content="Zim Currency Converter — SADC Region Exchange Rates">
	<meta property="og:description" content="Real-time exchange rates for Zimbabwe and the SADC region in a clean, minimalist interface.">
	<meta property="og:image" content="https://zim-currency-converter.pages.dev/assets/og-image.png">

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" content="https://zim-currency-converter.pages.dev/">
	<meta property="twitter:title" content="Zim Currency Converter — SADC Region Exchange Rates">
	<meta property="twitter:description" content="Real-time exchange rates for Zimbabwe and the SADC region in a clean, minimalist interface.">
	<meta property="twitter:image" content="https://zim-currency-converter.pages.dev/assets/og-image.png">
	<meta name="theme-color" id="theme-meta" content="#0D6EFD">

	<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">
	<script>
		(function() {
			const savedTheme = localStorage.getItem('theme');
			const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			const theme = savedTheme || (preferredDark ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<script src="script.js" defer></script>
</head>
<body>
	<div class="app-container">
		<header>
			<h1>
				<svg class="icon icon-header" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 22 1-1h8l1-1V5l-1-1h-8l-1-1H3L2 4v15l1 1h8l1 1Z"/><path d="M12 18v4"/><path d="M12 2v3"/><path d="M12 7v8"/></svg>
				Zim Currency Converter
			</h1>
			<button id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
				<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
				<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
			</button>
		</header>

		<main>
			<form id="converter-form" aria-label="Currency converter" novalidate>
				<label for="amount">Amount</label>
				<div class="input-with-symbol">
					<span id="currency-symbol">$</span>
					<input id="amount" name="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00" required />
				</div>

				<div class="currency-row">
					<div class="group from">
						<label for="from">From</label>
						<div class="select-wrapper">
							<select id="from" name="from" class="native-select" aria-label="From currency"></select>
						</div>
					</div>

					<button id="swap" type="button" aria-label="Swap currencies">
						<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4-4 4-4"/><path d="M3 17h18"/><path d="m17 3 4 4-4 4"/><path d="M21 7H3"/></svg>
					</button>

					<div class="group to">
						<label for="to">To</label>
						<div class="select-wrapper">
							<select id="to" name="to" class="native-select" aria-label="To currency"></select>
						</div>
					</div>
				</div>

				<button type="submit">Convert</button>
			</form>

			<section class="result-panel" aria-live="polite" hidden>
				<p class="conversion-text"></p>
				<p class="rate-text"></p>
				<p class="timestamp"></p>
			</section>
		</main>

		<footer>
			<p>Rates by ExchangeRate-API</p>
		</footer>
	</div>
</body>
</html>
